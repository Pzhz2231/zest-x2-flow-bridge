[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zest-x2-flow-bridge"
version = "0.1.0"
description = "Allowlisted MCP bridge to the two X² Flow Agent apps used by Zest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zest-x2-flow-bridge = "main:main"

[tool.setuptools]
py-modules = ["main"]
